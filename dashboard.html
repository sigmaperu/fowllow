<title>Dashboard | Fowllow</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#07133A;
  color:white;
  font-family:Segoe UI,sans-serif;
}

.sidebar{
  position:fixed;
  width:250px;
  height:100vh;
  background:#08112F;
  padding:25px;
}

.brand{
  text-align:center;
  margin-bottom:40px;
}

.brand img{

}

.brand h2{
  margin-top:10px;
}

.menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.menu a:hover{
  background:#112056;
}

.main{
  margin-left:250px;
  padding:30px;
}

.title{
  margin-bottom:30px;
}

.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#0F1F52;
  padding:25px;
  border-radius:20px;
}

.card h3{
  color:#cbd5e1;
  font-size:14px;
}

.card .value{
  font-size:42px;
  margin-top:10px;
  font-weight:bold;
}

</style>

</head>

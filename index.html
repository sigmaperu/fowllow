<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fowllow</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#07133A;
    color:white;
    font-family:'Segoe UI',sans-serif;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    margin-bottom:30px;
}

.logo-fowllow{
    width:180px;
    height:auto;
}

.logo-sigma{
    width:120px;
    height:auto;
}

h1{
    font-size:72px;
    font-weight:700;
    margin-bottom:12px;
}

.subtitle{
    font-size:28px;
    color:#CBD5E1;
    margin-bottom:35px;
}

.badge{
    background:#EC4899;
    color:white;
    padding:16px 32px;
    border-radius:16px;
    font-size:24px;
    font-weight:600;
    box-shadow:0 10px 25px rgba(236,72,153,.25);
}

.footer{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#94A3B8;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

    <div class="brand">

        <img
            src="logo/fowllow-icon.png"
          v>

    <h1>Fowllow</h1>

    <div class="subtitle">
        Track. Analyze. Deliver.
    </div>

    <div class="badge">
        Coming Soon
    </div>

</div>

<div class="footer">
    Powered by Sigma + Fowllow
</div>

</body>
</html>

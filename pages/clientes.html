<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <meta name="description" content="Mapa operativo de clientes GreenMile por placa, ruta o código de cliente">
  <title>Clientes | Monitoreo GreenMile</title>
  <link rel="stylesheet" href="../components/theme.css?v=12-1">
  <link rel="stylesheet" href="../components/main.css?v=12-1">
  <link rel="stylesheet" href="../components/layout.css?v=12-1">
  <link rel="stylesheet" href="../components/components.css?v=12-1">
  <link rel="stylesheet" href="../assets/css/sidebar-notch.css?v=12-1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="../assets/css/clientes.css?v=12-5-5">
</head>
<body data-page="clientes">
  <div id="sidebar"></div>
  <div class="gm-shell">
    <div id="navbar"></div>
    <main class="gm-content">
      <header class="gm-heading">
        <h1>Clientes</h1>
        <p>Consulta operativa de clientes en mapa por placa, ruta o código.</p>
      </header>

      <div id="clientsError" class="gm-alert" role="alert" hidden></div>

      <section class="cl-toolbar" aria-label="Búsqueda y acciones">
        <div class="cl-quick-search">
          <label class="cl-field cl-field--mode">
            <span class="cl-label">Buscar por</span>
            <select id="searchMode">
              <option value="all">Todos los clientes</option>
              <option value="vehicle">Placa exacta</option>
              <option value="route">Ruta exacta</option>
              <option value="client">Código de cliente</option>
            </select>
          </label>
          <label class="cl-field cl-field--query">
            <span class="cl-label">Valor</span>
            <input id="quickSearch" type="search" placeholder="Todos los clientes (sin filtro)" autocomplete="off" disabled>
            <select id="quickSearchSelect" aria-label="Valor de búsqueda" hidden disabled>
              <option value="">Selecciona una opción</option>
            </select>
          </label>
          <button id="searchButton" type="button" class="cl-button cl-button--primary" disabled>Buscar</button>

          <div class="cl-scope-control">
            <div id="migrationSegmented" class="vh-segmented" role="group" aria-label="Alcance de migración">
              <button type="button" class="vh-segmented__button" data-scope="MIGRADOS" aria-pressed="false">Migrados</button>
              <button type="button" class="vh-segmented__button" data-scope="NO_MIGRADOS" aria-pressed="false">No Migrados</button>
              <button type="button" class="vh-segmented__button is-active" data-scope="PLANIFICADOS" aria-pressed="true">Planificados</button>
            </div>
          </div>
        </div>

        <div class="cl-actions">
          <details id="filtersPanel" class="cl-filters">
            <summary>Filtros <span id="filterCount" class="cl-filter-count" hidden>0</span></summary>
            <div class="cl-filters__body">
              <label class="cl-field">
                <span class="cl-label">Canal</span>
                <select id="channelFilter"><option value="">Todos los canales</option></select>
              </label>
              <label class="cl-field">
                <span class="cl-label">Estado</span>
                <select id="statusFilter">
                  <option value="">Todos los estados</option>
                  <option value="ENTREGADO">Entregado</option>
                  <option value="PENDIENTE">Pendiente</option>
                  <option value="RECHAZADO">Rechazado</option>
                  <option value="SIN INFORMACION">Sin información</option>
                </select>
              </label>
            </div>
          </details>

          <!-- Botón Limpiar con Icono -->
          <button id="clearButton" type="button" class="cl-button cl-button--icon" title="Limpiar filtros" aria-label="Limpiar filtros">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>

          <!-- Botón CSV con Icono -->
          <button id="csvButton" type="button" class="cl-button cl-button--icon" title="Descargar CSV" aria-label="Descargar CSV" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </div>
      </section>

      <div class="cl-summary" aria-live="polite">
        <span id="visibleCount">Cargando clientes…</span>
        <span id="coordinateCount"></span>
      </div>

      <section class="cl-map-card" aria-label="Mapa de clientes">
        <div id="clientMap" class="cl-map">
          <div class="cl-map-empty"><span>⌖</span><strong>Cargando mapa</strong><small>Preparando la información operativa.</small></div>
        </div>
      </section>

      <section class="cl-table-card" aria-label="Clientes filtrados">
        <div class="cl-table-wrap">
          <table class="cl-table">
            <thead><tr>
              <th><button class="cl-sort" data-sort="account">Cliente <span>↑</span></button></th>
              <th><button class="cl-sort" data-sort="location">Ubicación <span>↕</span></button></th>
              <th><button class="cl-sort" data-sort="vehicle">Operación <span>↕</span></button></th>
              <th><button class="cl-sort" data-sort="driverName">Auxiliar <span>↕</span></button></th>
              <th><button class="cl-sort" data-sort="status">Estado <span>↕</span></button></th>
              <th class="cl-col-number"><button class="cl-sort" data-sort="kg">Kg <span>↕</span></button></th>
            </tr></thead>
            <tbody id="clientTable"><tr><td colspan="6" class="cl-empty">Cargando clientes…</td></tr></tbody>
          </table>
        </div>
        <div class="cl-table-footer">
          <span id="renderCount">0 registros visibles</span>
          <button id="loadMoreButton" type="button" class="cl-button" hidden>Mostrar 50 más</button>
        </div>
      </section>
    </main>
    <div id="footer"></div>
  </div>

  <script src="../assets/js/load-components.js?v=12-1"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="../assets/js/clientes.js?v=12-5-5"></script>
</body>
</html>

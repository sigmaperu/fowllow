<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <meta name="description" content="Trazabilidad y Búsqueda Operativa - Fowllow Trace">
  <title>Trace | Fowllow</title>
  <link rel="stylesheet" href="../components/theme.css?v=9">
  <link rel="stylesheet" href="../components/main.css?v=9">
  <link rel="stylesheet" href="../components/layout.css?v=9">
  <link rel="stylesheet" href="../components/components.css?v=9">
  <link rel="stylesheet" href="../assets/css/sidebar-notch.css?v=9">
  <link rel="stylesheet" href="../assets/css/dashboard.css?v=9">
  <style>
    .trace-container { display: grid; gap: 20px; margin-top: 20px; }
    .trace-card { background: var(--gm-surface, #fff); border: 1px solid #dde4ed; border-radius: 16px; padding: 24px; box-shadow: 0 4px 12px rgba(15,23,42,.05); }
    .trace-form-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; position: relative; }
    .trace-input { flex: 1; min-width: 260px; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .trace-input:focus { border-color: var(--gm-blue, #2563eb); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .trace-btn { padding: 12px 24px; background: var(--gm-blue, #2563eb); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .trace-btn:hover { opacity: 0.9; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 10; box-shadow: 0 8px 20px rgba(15,23,42,0.1); margin-top: 4px; }
    .autocomplete-item { padding: 10px 14px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    .autocomplete-item:hover { background: #f8fafc; color: var(--gm-blue, #2563eb); }
    
    /* Contenedores de resultados y tablas estilizadas */
    .result-box { margin-top: 16px; display: none; }
    .gm-result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
    .gm-info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
    .gm-info-card label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 4px; }
    .gm-info-card span { font-size: 1rem; color: #1e293b; font-weight: 600; }
    
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .gm-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; background: #fff; }
    .gm-table th { background: #f1f5f9; color: #334155; padding: 10px 12px; font-weight: 700; border-bottom: 1px solid #e2e8f0; }
    .gm-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #475569; }
    .gm-table tr:last-child td { border-bottom: none; }
    
    .trace-mode-selector { display: flex; gap: 12px; margin-bottom: 16px; }
    .trace-mode-btn { padding: 10px 20px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .trace-mode-btn.active { background: var(--gm-blue, #2563eb); color: #fff; border-color: var(--gm-blue, #2563eb); }
  </style>
</head>
<body data-page="trace">
  <div id="sidebar"></div>
  <div class="gm-shell">
    <div id="navbar"></div>
    <main class="gm-content">
      <header class="gm-heading">
        <h1>Fowllow Trace</h1>
        <p>Módulo de consulta y trazabilidad operativa (BaseTrazabilidad.csv).</p>
      </header>

      <div id="traceError" class="gm-alert" role="alert" hidden style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px;"></div>

      <div class="trace-container">
        <!-- Selector de Alternativa -->
        <div class="trace-mode-selector">
          <button id="btnModePedido" class="trace-mode-btn active">🔍 Buscar por Pedido</button>
          <button id="btnModeProducto" class="trace-mode-btn">📦 Buscar por Producto</button>
        </div>

        <!-- 1. Búsqueda por Pedido -->
        <section id="sectionPedido" class="trace-card">
          <h2 style="font-size: 1.1rem; color: #1e293b; margin-bottom: 4px;">🔍 Búsqueda por Pedido (Shipment Custom)</h2>
          <p style="font-size: 0.85rem; color: #64748b;">Obtén el detalle completo del despacho en formato de tarjetas.</p>
          <div class="trace-form-group">
            <input type="text" id="pedidoInput" class="trace-input" placeholder="Ej. 3033203774...">
            <button id="buscarPedidoBtn" class="trace-btn">Consultar Pedido</button>
          </div>
          <div id="pedidoResult" class="result-box"></div>
        </section>

        <!-- 2. Búsqueda por Producto -->
        <section id="sectionProducto" class="trace-card" style="display: none;">
          <h2 style="font-size: 1.1rem; color: #1e293b; margin-bottom: 4px;">📦 Búsqueda por Producto (Item Description)</h2>
          <p style="font-size: 0.85rem; color: #64748b;">Escribe el producto y consulta el resumen consolidado en tabla.</p>
          <div class="trace-form-group">
            <div style="position: relative; flex: 1; display: flex;">
              <input type="text" id="productoInput" class="trace-input" placeholder="Escribe el nombre del producto..." style="width: 100%;">
              <div id="productoAutocomplete" class="autocomplete-list" style="display: none;"></div>
            </div>
            <button id="buscarProductoBtn" class="trace-btn">Ver Resumen</button>
          </div>
          <div id="productoResult" class="result-box"></div>
        </section>
      </div>
    </main>
    <div id="footer"></div>
  </div>

  <script src="../assets/js/load-components.js?v=9"></script>
  <script type="module" src="../assets/js/trace.js?v=9"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vista operativa de vehículos de GreenMile y RoadMap">
  <title>Vehículos | Monitoreo GreenMile</title>
  <link rel="stylesheet" href="../components/theme.css?v=10-1">
  <link rel="stylesheet" href="../components/main.css?v=10-1">
  <link rel="stylesheet" href="../components/layout.css?v=10-1">
  <link rel="stylesheet" href="../components/components.css?v=10-1">
  <link rel="stylesheet" href="../assets/css/sidebar-notch.css?v=10-1">
  <link rel="stylesheet" href="../assets/css/vehiculos.css?v=10-1">
</head>
<body data-page="vehiculos">
  <div id="sidebar"></div>
  <div class="gm-shell">
    <div id="navbar"></div>
    <main class="gm-content">
      <header class="gm-heading">
        <h1>Vehículos</h1>
        <p>Vista operativa de la flota y sus indicadores.</p>
      </header>

      <div id="vehiclesError" class="gm-alert" role="alert" hidden></div>

      <section class="vh-kpis" aria-label="Resumen de vehículos">
        <article class="vh-kpi vh-kpi--total"><span>Total</span><strong id="totalVehicles">—</strong><small>vehículos</small></article>
        <article class="vh-kpi vh-kpi--migration"><span>Migrados</span><strong id="migratedVehicles">—</strong><small id="migrationPct">Cargando…</small></article>
        <article class="vh-kpi vh-kpi--connection"><span>Conectados</span><strong id="connectedVehicles">—</strong><small id="connectionPct">Cargando…</small></article>
        <article class="vh-kpi vh-kpi--progress"><span>Avance</span><strong id="avgProgress">—</strong><small id="progressRatio">Cargando…</small></article>
        <article class="vh-kpi vh-kpi--client"><span>DBE Clie</span><strong id="dbeClient">—</strong><small id="dbeClientRatio">Cargando…</small></article>
        <article class="vh-kpi vh-kpi--kg"><span>DBE Kg</span><strong id="dbeKg">—</strong><small id="dbeKgRatio">Cargando…</small></article>
      </section>

      <section class="vh-toolbar" aria-label="Filtros de vehículos">
        <label class="vh-search">
          <span class="vh-sr-only">Buscar vehículo</span>
          <input id="vehicleSearch" type="search" placeholder="Buscar VehicleKey…" autocomplete="off">
        </label>
        <label>
          <span class="vh-sr-only">Filtrar por Location</span>
          <select id="locationFilter"><option value="">Todas las Location</option></select>
        </label>
        <label>
          <span class="vh-sr-only">Filtrar por migración</span>
          <select id="migrationFilter"><option value="">Toda migración</option><option value="MIGRADO">MIGRADO</option><option value="NO MIGRADO">NO MIGRADO</option></select>
        </label>
        <span id="visibleCount" class="vh-visible-count"></span>
      </section>

      <section class="vh-table-wrap" aria-label="Detalle por vehículo">
        <table class="vh-table">
          <thead><tr>
            <th>VehicleKey</th><th>Location</th><th>Migración</th><th>Conexión</th>
            <th>Clientes</th><th>Visitados</th><th>Rechazados</th>
            <th>Avance</th><th>DBE Clie</th><th>DBE Kg</th>
          </tr></thead>
          <tbody id="vehicleTable"><tr><td colspan="10" class="vh-empty">Cargando datos…</td></tr></tbody>
        </table>
      </section>
    </main>
    <div id="footer"></div>
  </div>
  <script src="../assets/js/load-components.js?v=10-1"></script>
  <script type="module" src="../assets/js/vehiculos.js?v=10-1"></script>
</body>
</html>
